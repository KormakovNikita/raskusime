<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Раскуси — психологические подсказки</title>
    <meta
      name="description"
      content="Лаконичные психологические предсказания в стиле китайского печенья с запиской. 29 ₽."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#121212',
              sand: '#c4a574',
              'sand-light': '#d4bc8e',
              'sand-dim': '#8a7350',
              mist: '#a8a8a8',
              parchment: '#f7f1e6',
            },
            fontFamily: {
              sans: ['"Manrope"', 'system-ui', 'sans-serif'],
              serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-ink text-white font-sans antialiased min-h-screen overflow-x-hidden">
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="grain"></div>
    </div>

    <div class="relative z-10 min-h-screen flex flex-col">
      <header class="w-full px-5 sm:px-8 py-5 flex items-center justify-between gap-4 header-fade">
        <a
          href="/"
          class="logo-mark text-sm sm:text-base tracking-[0.35em] font-medium text-white/90 hover:text-sand transition-colors"
          >РАСКУСИ</a
        >
        <p class="text-[11px] sm:text-xs text-white/35 tracking-wide text-right">
          Психологические подсказки · 29 ₽
        </p>
      </header>

      <main class="flex-1 flex flex-col items-center justify-center px-5 sm:px-8 pb-16 pt-4">
        <div
          id="cookie-stage"
          class="relative z-0 w-full max-w-lg flex items-center justify-center mb-10 sm:mb-12"
        >
          <div class="cookie-glow" aria-hidden="true"></div>

          <div id="cookie-wrap" class="cookie-wrap relative w-56 h-40 sm:w-72 sm:h-48">
            <!-- Whole closed cookie -->
            <svg
              id="cookie-whole"
              class="cookie-svg absolute inset-0 w-full h-full drop-shadow-cookie"
              viewBox="0 0 280 180"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <defs>
                <radialGradient id="cookieBody" cx="42%" cy="35%" r="65%">
                  <stop offset="0%" stop-color="#e8d4a8" />
                  <stop offset="45%" stop-color="#d4bc8e" />
                  <stop offset="100%" stop-color="#a88955" />
                </radialGradient>
                <linearGradient id="cookieShade" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#fff6e0" stop-opacity="0.35" />
                  <stop offset="55%" stop-color="#c4a574" stop-opacity="0" />
                  <stop offset="100%" stop-color="#6e5633" stop-opacity="0.35" />
                </linearGradient>
                <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="0.6" />
                </filter>
              </defs>

              <!-- soft ground shadow -->
              <ellipse cx="140" cy="152" rx="78" ry="10" fill="#000" opacity="0.28" />

              <!-- main body -->
              <path
                d="M48 96
                   C52 52 95 34 140 34
                   C185 34 228 52 232 96
                   C236 128 198 148 140 148
                   C82 148 44 128 48 96 Z"
                fill="url(#cookieBody)"
              />
              <path
                d="M48 96
                   C52 52 95 34 140 34
                   C185 34 228 52 232 96
                   C236 128 198 148 140 148
                   C82 148 44 128 48 96 Z"
                fill="url(#cookieShade)"
              />

              <!-- folded ridge -->
              <path
                d="M70 88 C100 62 140 78 140 94 C140 78 180 62 210 88"
                fill="none"
                stroke="#8a6f42"
                stroke-width="3.2"
                stroke-linecap="round"
                opacity="0.55"
              />
              <path
                d="M78 92 C105 70 140 84 140 98 C140 84 175 70 202 92"
                fill="none"
                stroke="#f0e0bc"
                stroke-width="1.4"
                stroke-linecap="round"
                opacity="0.45"
              />

              <!-- seam notch -->
              <path
                d="M132 78 L140 98 L148 78"
                fill="none"
                stroke="#7a6238"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.5"
              />

              <!-- baked speckles -->
              <g fill="#8a7350" opacity="0.35">
                <ellipse cx="92" cy="70" rx="3.2" ry="2.2" />
                <ellipse cx="118" cy="58" rx="2.4" ry="1.8" />
                <ellipse cx="168" cy="64" rx="2.8" ry="2" />
                <ellipse cx="196" cy="78" rx="2.2" ry="1.6" />
                <ellipse cx="108" cy="118" rx="2.6" ry="1.9" />
                <ellipse cx="176" cy="122" rx="3" ry="2.1" />
                <ellipse cx="148" cy="112" rx="2" ry="1.5" />
              </g>

              <!-- rim highlight -->
              <path
                d="M64 78 C90 48 140 42 140 42 C140 42 190 48 216 78"
                fill="none"
                stroke="#fff4d8"
                stroke-width="2"
                stroke-linecap="round"
                opacity="0.28"
                filter="url(#soft)"
              />
            </svg>

            <!-- Left half -->
            <svg
              id="cookie-left"
              class="cookie-half absolute inset-0 w-full h-full opacity-0 pointer-events-none"
              viewBox="0 0 280 180"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <defs>
                <linearGradient id="leftFill" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#e2c994" />
                  <stop offset="100%" stop-color="#b08d52" />
                </linearGradient>
              </defs>
              <path
                d="M48 96
                   C52 52 95 34 140 34
                   L138 98
                   L140 148
                   C82 148 44 128 48 96 Z"
                fill="url(#leftFill)"
              />
              <!-- jagged break -->
              <path
                d="M140 34 L132 58 L142 78 L130 98 L144 122 L138 148"
                fill="none"
                stroke="#6e5530"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.7"
              />
              <path
                d="M140 34 L132 58 L142 78 L130 98 L144 122 L138 148 L140 148 L140 34 Z"
                fill="#c9a86a"
                opacity="0.55"
              />
              <ellipse cx="92" cy="70" rx="3" ry="2" fill="#8a7350" opacity="0.35" />
              <ellipse cx="108" cy="118" rx="2.4" ry="1.8" fill="#8a7350" opacity="0.3" />
            </svg>

            <!-- Right half -->
            <svg
              id="cookie-right"
              class="cookie-half absolute inset-0 w-full h-full opacity-0 pointer-events-none"
              viewBox="0 0 280 180"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <defs>
                <linearGradient id="rightFill" x1="1" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#d8bd88" />
                  <stop offset="100%" stop-color="#9a7a45" />
                </linearGradient>
              </defs>
              <path
                d="M140 34
                   C185 34 228 52 232 96
                   C236 128 198 148 140 148
                   L142 98
                   Z"
                fill="url(#rightFill)"
              />
              <path
                d="M140 34 L148 58 L138 78 L150 98 L136 122 L142 148"
                fill="none"
                stroke="#6e5530"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.7"
              />
              <path
                d="M140 34 L148 58 L138 78 L150 98 L136 122 L142 148 L140 148 L140 34 Z"
                fill="#b8955f"
                opacity="0.5"
              />
              <ellipse cx="196" cy="78" rx="2.4" ry="1.8" fill="#8a7350" opacity="0.35" />
              <ellipse cx="176" cy="122" rx="2.8" ry="2" fill="#8a7350" opacity="0.3" />
            </svg>

            <div id="crumb-layer" class="crumb-layer absolute inset-0 pointer-events-none" aria-hidden="true"></div>

            <article
              id="fortune-slip"
              class="fortune-slip absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[min(88vw,300px)] bg-parchment text-ink px-5 py-7 sm:px-7 sm:py-9 opacity-0 pointer-events-none z-[2]"
              aria-live="polite"
            >
              <div
                class="fortune-inner font-serif text-[15px] sm:text-[17px] leading-relaxed text-center space-y-5 text-[#2a2520]"
              >
                <p id="fortune-block-1" class="whitespace-pre-line"></p>
                <p id="fortune-block-2" class="whitespace-pre-line"></p>
                <p id="fortune-block-3" class="whitespace-pre-line font-semibold"></p>
              </div>
            </article>
          </div>
        </div>

        <section id="stage-form" class="relative z-20 w-full max-w-md space-y-8 stage-panel">
          <div class="space-y-6">
            <label class="block">
              <span class="sr-only">Ваше имя</span>
              <input
                id="input-name"
                type="text"
                name="name"
                autocomplete="given-name"
                maxlength="80"
                placeholder="Ваше имя"
                class="field-line w-full bg-transparent border-0 border-b border-white/20 focus:border-sand outline-none py-3 text-sm text-white/90 placeholder:text-white/30 transition-colors"
              />
            </label>

            <div>
              <p class="text-[11px] uppercase tracking-[0.2em] text-white/30 mb-3">Пол</p>
              <div class="flex gap-3" role="group" aria-label="Пол">
                <button
                  type="button"
                  data-gender="m"
                  class="gender-btn flex-1 py-2.5 text-sm border border-white/15 text-white/50 hover:border-sand/50 hover:text-sand transition-colors"
                >
                  М
                </button>
                <button
                  type="button"
                  data-gender="f"
                  class="gender-btn flex-1 py-2.5 text-sm border border-white/15 text-white/50 hover:border-sand/50 hover:text-sand transition-colors"
                >
                  Ж
                </button>
              </div>
            </div>

            <label class="block">
              <span class="sr-only">Ваш вопрос к печенью</span>
              <textarea
                id="input-question"
                name="question"
                rows="3"
                maxlength="500"
                placeholder="Оставьте пустым для случайного предсказания..."
                class="field-line w-full bg-transparent border border-white/15 focus:border-sand outline-none px-0 py-3 text-sm text-white/90 placeholder:text-white/30 transition-colors resize-none leading-relaxed"
              ></textarea>
            </label>
          </div>

          <p id="form-error" class="hidden text-sm text-red-300/90 text-center" role="alert"></p>

          <button
            id="btn-pay"
            type="button"
            class="btn-gold relative z-20 w-full py-4 px-6 text-sm sm:text-[15px] font-medium tracking-wide text-ink bg-sand hover:bg-sand-light disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Раскусить за 29 ₽ через T-Pay
          </button>

          <p id="demo-hint" class="hidden text-center text-[11px] text-white/25 tracking-wide">
            Демо-режим: оплата симулируется без реального списания
          </p>
        </section>

        <section id="stage-loader" class="hidden w-full max-w-sm flex-col items-center gap-6 stage-panel">
          <div class="loader-ring" aria-hidden="true"></div>
          <p id="loader-text" class="text-sm text-white/45 tracking-wide text-center">
            Проверяем транзакцию...
          </p>
        </section>

        <section id="stage-again" class="hidden relative z-20 w-full max-w-sm mx-auto mt-8 sm:mt-10 stage-panel">
          <button
            id="btn-again"
            type="button"
            class="w-full py-3.5 px-6 text-sm border border-sand/40 text-sand hover:bg-sand/10 transition-colors tracking-wide btn-ghost"
          >
            Получить еще одно предсказание
          </button>
        </section>
      </main>

      <footer class="px-5 sm:px-8 py-6 text-center text-[10px] sm:text-[11px] text-white/20 tracking-wide">
        Не магия — психологические метафоры. Один ответ — 29 ₽.
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
