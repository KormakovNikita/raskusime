<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Раскуси — психологические подсказки</title>
    <meta
      name="description"
      content="Лаконичные психологические предсказания в стиле китайского печенья с запиской. 29 ₽."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#121212',
              sand: '#c4a574',
              'sand-light': '#d4bc8e',
              'sand-dim': '#8a7350',
              mist: '#a8a8a8',
              parchment: '#f7f1e6',
            },
            fontFamily: {
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
              serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-ink text-white font-sans antialiased min-h-screen">
    <div class="relative min-h-screen flex flex-col">
      <header class="w-full px-5 sm:px-8 py-5 flex items-center justify-between gap-4">
        <a href="/" class="text-sm sm:text-base tracking-[0.35em] font-medium text-white/90 hover:text-sand transition-colors"
          >РАСКУСИ</a
        >
        <p class="text-[11px] sm:text-xs text-white/35 tracking-wide text-right">
          Психологические подсказки · 29 ₽
        </p>
      </header>

      <main class="flex-1 flex flex-col items-center justify-center px-5 sm:px-8 pb-16 pt-4">
        <!-- Cookie stage -->
        <div id="cookie-stage" class="relative w-full max-w-md flex items-center justify-center mb-10 sm:mb-12">
          <div id="cookie-wrap" class="cookie-wrap relative w-48 h-32 sm:w-56 sm:h-36">
            <svg
              id="cookie-whole"
              class="cookie-svg absolute inset-0 w-full h-full"
              viewBox="0 0 220 140"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <ellipse cx="110" cy="72" rx="88" ry="42" fill="#c4a574" opacity="0.95" />
              <ellipse cx="110" cy="68" rx="88" ry="42" fill="#d4bc8e" />
              <path
                d="M28 68 Q70 48 110 68 Q150 88 192 68"
                fill="none"
                stroke="#8a7350"
                stroke-width="2.5"
                stroke-linecap="round"
                opacity="0.55"
              />
              <ellipse cx="72" cy="58" rx="4" ry="3" fill="#a88955" opacity="0.45" />
              <ellipse cx="148" cy="78" rx="3.5" ry="2.5" fill="#a88955" opacity="0.4" />
              <ellipse cx="118" cy="52" rx="3" ry="2.2" fill="#a88955" opacity="0.35" />
            </svg>

            <svg
              id="cookie-left"
              class="cookie-half absolute inset-0 w-full h-full opacity-0 pointer-events-none"
              viewBox="0 0 220 140"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M110 26 C62 26 22 44 22 68 C22 92 62 110 110 110 L110 26 Z"
                fill="#d4bc8e"
              />
              <path
                d="M110 26 C62 26 22 44 22 68 C22 92 62 110 110 110"
                fill="none"
                stroke="#8a7350"
                stroke-width="1.5"
                opacity="0.4"
              />
              <path d="M110 30 L105 68 L110 106" fill="#b8955f" opacity="0.55" />
            </svg>

            <svg
              id="cookie-right"
              class="cookie-half absolute inset-0 w-full h-full opacity-0 pointer-events-none"
              viewBox="0 0 220 140"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M110 26 C158 26 198 44 198 68 C198 92 158 110 110 110 L110 26 Z"
                fill="#c4a574"
              />
              <path
                d="M110 26 C158 26 198 44 198 68 C198 92 158 110 110 110"
                fill="none"
                stroke="#8a7350"
                stroke-width="1.5"
                opacity="0.35"
              />
              <path d="M110 30 L115 68 L110 106" fill="#a88955" opacity="0.45" />
            </svg>

            <article
              id="fortune-slip"
              class="fortune-slip absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[min(88vw,280px)] bg-parchment text-ink px-5 py-7 sm:px-6 sm:py-8 opacity-0 pointer-events-none shadow-[0_12px_40px_rgba(0,0,0,0.45)]"
              aria-live="polite"
            >
              <div class="fortune-inner font-serif text-[15px] sm:text-base leading-relaxed text-center space-y-5 text-[#2a2520]">
                <p id="fortune-block-1" class="whitespace-pre-line"></p>
                <p id="fortune-block-2" class="whitespace-pre-line"></p>
                <p id="fortune-block-3" class="whitespace-pre-line font-semibold"></p>
              </div>
            </article>
          </div>
        </div>

        <!-- Stage 1: form -->
        <section id="stage-form" class="w-full max-w-md space-y-8">
          <div class="space-y-6">
            <label class="block">
              <span class="sr-only">Ваше имя</span>
              <input
                id="input-name"
                type="text"
                name="name"
                autocomplete="given-name"
                maxlength="80"
                placeholder="Ваше имя"
                class="field-line w-full bg-transparent border-0 border-b border-white/20 focus:border-sand outline-none py-3 text-sm text-white/90 placeholder:text-white/30 transition-colors"
              />
            </label>

            <div>
              <p class="text-[11px] uppercase tracking-[0.2em] text-white/30 mb-3">Пол</p>
              <div class="flex gap-3" role="group" aria-label="Пол">
                <button
                  type="button"
                  data-gender="m"
                  class="gender-btn flex-1 py-2.5 text-sm border border-white/15 text-white/50 hover:border-sand/50 hover:text-sand transition-colors"
                >
                  М
                </button>
                <button
                  type="button"
                  data-gender="f"
                  class="gender-btn flex-1 py-2.5 text-sm border border-white/15 text-white/50 hover:border-sand/50 hover:text-sand transition-colors"
                >
                  Ж
                </button>
              </div>
            </div>

            <label class="block">
              <span class="sr-only">Ваш вопрос к печенью</span>
              <textarea
                id="input-question"
                name="question"
                rows="3"
                maxlength="500"
                placeholder="Оставьте пустым для случайного предсказания..."
                class="field-line w-full bg-transparent border border-white/15 focus:border-sand outline-none px-0 py-3 text-sm text-white/90 placeholder:text-white/30 transition-colors resize-none leading-relaxed"
              ></textarea>
            </label>
          </div>

          <p id="form-error" class="hidden text-sm text-red-300/90 text-center" role="alert"></p>

          <button
            id="btn-pay"
            type="button"
            class="btn-gold w-full py-4 px-6 text-sm sm:text-[15px] font-medium tracking-wide text-ink bg-sand hover:bg-sand-light transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Раскусить за 29 ₽ через T-Pay
          </button>

          <p id="demo-hint" class="hidden text-center text-[11px] text-white/25 tracking-wide">
            Демо-режим: оплата симулируется без реального списания
          </p>
        </section>

        <!-- Stage 2: loader -->
        <section id="stage-loader" class="hidden w-full max-w-sm flex-col items-center gap-6">
          <div class="loader-ring" aria-hidden="true"></div>
          <p id="loader-text" class="text-sm text-white/45 tracking-wide text-center">
            Проверяем транзакцию...
          </p>
        </section>

        <!-- Stage 3: after fortune -->
        <section id="stage-again" class="hidden w-full max-w-md mt-10 sm:mt-14">
          <button
            id="btn-again"
            type="button"
            class="w-full py-3.5 px-6 text-sm border border-sand/40 text-sand hover:bg-sand/10 transition-colors tracking-wide"
          >
            Получить еще одно предсказание
          </button>
        </section>
      </main>

      <footer class="px-5 sm:px-8 py-6 text-center text-[10px] sm:text-[11px] text-white/20 tracking-wide">
        Не магия — психологические метафоры. Один ответ — 29 ₽.
      </footer>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
